{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CGPA to Percentage Calculator | StudentHub</title>

    <link rel="stylesheet" href="{% static 'StudentX/css/style.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="{% url 'home' %}" class="logo">StudentHub</a>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="#tools">Tools</a>
            <a href="#about">About</a>
        </div>
    </nav>


    <!-- Calculator -->
    <main class="cgpa-percentage-page">

        <div class="cgpa-percentage-container">

            <div class="page-header">
                <h1>CGPA → Percentage Calculator</h1>

                <p>
                    Convert your CGPA into percentage quickly and easily.
                </p>
            </div>


            <div class="calculator-card">

                <div class="form-group">

                    <label for="cgpaInput">
                        Enter your CGPA
                    </label>

                    <input
                        type="number"
                        id="cgpaInput"
                        placeholder="Example: 7.5"
                        min="0"
                        max="10"
                        step="0.01"
                    >

                </div>


                <div class="button-group">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        onclick="resetCalculator()">
                        Reset
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="calculatePercentage()">
                        Convert to Percentage
                    </button>

                </div>


                <div id="errorMessage" class="error-message"></div>


                <div id="results" class="results">

                    <h2>Result</h2>

                    <div class="result-grid">

                        <div class="result-box">
                            <span>CGPA</span>
                            <strong id="cgpaResult">0</strong>
                        </div>

                        <div class="result-box">
                            <span>Percentage</span>
                            <strong id="percentageResult">0%</strong>
                        </div>

                    </div>


                    <div class="formula-box">

                        <h3>Formula</h3>

                        <p>
                            Percentage = CGPA × 10
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 StudentHub. All rights reserved.</p>
    </footer>


    <script src="{% static 'StudentX/js/cgpa_percentage.js' %}"></script>

</body>
</html>
